<script>
  // Áp theme ngay trước khi vẽ để không bị nháy trắng khi đang ở chế độ tối
  try {
    var _t = localStorage.getItem("ontap.theme");
    if (_t === "dark" || (!_t && window.matchMedia("(prefers-color-scheme: dark)").matches))
      document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
</script>
